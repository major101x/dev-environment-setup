name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + bats
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The pinned release binary, not apt -- for the same reason `bats` is
      # fetched rather than apt-installed below: the version is ours to choose
      # and a build should not turn on what a distro happens to ship.
      #
      # It also stops an unrelated third-party apt source failing this job.
      # `apt-get update` reads every list on the runner, and the preinstalled
      # Google Chrome repo served an index whose hashes did not match its
      # release file, which failed the whole step with exit 100 -- for a build
      # that only ever wanted one static binary out of Ubuntu's own archive.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      # One file per invocation: `bash -n a b` parses only `a` and passes `b`
      # as a positional argument.
      - name: bash -n
        run: |
          for f in setup.sh test/run.sh test/helpers.bash; do
            echo "bash -n $f"
            bash -n "$f"
          done

      # -S warning is the spec's "shellcheck info-level only" bar: it fails the
      # build on warnings and errors and leaves info/style findings alone.
      - name: shellcheck
        run: shellcheck -S warning setup.sh test/run.sh test/helpers.bash

      # No apt bats on purpose: test/run.sh fetches the version it pins, so CI
      # runs exactly what a fresh clone runs. The picker itself cannot run here
      # — fzf reads /dev/tty and cannot be driven by piped stdin. The callbacks
      # it re-enters setup.sh for can, and that is where the silent failures
      # live. See test/tui.bats and ADR-0008.
      - name: bats
        run: ./test/run.sh
